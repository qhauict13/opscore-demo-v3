<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>OPSCORE — Kiểm soát vận hành thương mại điện tử</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --nav:#132639; --nav-hi:#1E3A55; --nav-txt:#9FB6CC; --nav-txt2:#6E88A2;
  --paper:#F4F4F1; --card:#FFFFFF;
  --ink:#15171B; --ink2:#4B505A; --ink3:#858A93;
  --line:#E2E0DA; --line2:#EEECE6;
  --steel:#1B3A5F; --steel-soft:#EBF0F6; --steel2:#2A5075;
  --red:#B3261E; --red-soft:#FBEDEC; --red-line:#E9BEBA;
  --grn:#25694A; --grn-soft:#E8F2EC; --grn-line:#BBD9C8;
  --amb:#8A6100; --amb-soft:#FBF2DD; --amb-line:#E6D19C;
  --sh1:0 1px 2px rgba(21,23,27,.06);
  --sh2:0 2px 4px rgba(21,23,27,.05), 0 12px 28px -14px rgba(21,23,27,.28);
}
*{box-sizing:border-box}
html,body{margin:0;padding:0;height:100%}
body{background:var(--paper);color:var(--ink);font-family:Inter,system-ui,-apple-system,sans-serif;font-size:13.5px;line-height:1.5;-webkit-font-smoothing:antialiased;overflow:hidden}
.mono{font-family:"IBM Plex Mono",ui-monospace,monospace;font-variant-numeric:tabular-nums}
button,input,select,textarea{font-family:inherit;font-size:inherit}
button{cursor:pointer}
a{color:var(--steel)}
:focus-visible{outline:2px solid var(--steel);outline-offset:1px;border-radius:3px}
::-webkit-scrollbar{width:10px;height:10px}
::-webkit-scrollbar-thumb{background:#CFCDC6;border-radius:6px;border:3px solid var(--paper)}
::-webkit-scrollbar-track{background:transparent}
@media (prefers-reduced-motion: reduce){*{animation:none!important;transition:none!important}}
@media(max-width:820px){
  body{overflow:auto}
  .app{grid-template-columns:1fr;height:auto}
  .nav{flex-direction:row;overflow-x:auto;overflow-y:hidden;align-items:center;gap:2px;padding:0 8px;position:sticky;top:0;z-index:40}
  .nav .logo,.nav .navfoot{border:0;flex:none}
  .nav .tenantbox{border:0;flex:none;padding:8px}
  .nav .tenantbox label{display:none}
  .navgrp{display:flex;align-items:center;padding:0}
  .navgrp h6{display:none}
  .navitem{white-space:nowrap;border-left:0;border-bottom:2.5px solid transparent;padding:9px 11px}
  .navitem.on{border-left:0;border-bottom-color:#5B94CC}
  .hdr{height:auto;padding:9px 14px;flex-wrap:wrap}
  .search input{width:150px}
  .body{padding:14px}
  .cal{grid-template-columns:repeat(10,1fr)}
  .rung{grid-template-columns:1fr 96px;gap:8px}
  .rung .rbar,.rung .rp{display:none}
  table{font-size:12.5px}
  .card{overflow-x:auto}
}

/* ============ KHUNG ============ */
.app{display:grid;grid-template-columns:230px 1fr;height:100vh}
.nav{background:var(--nav);color:#fff;display:flex;flex-direction:column;overflow-y:auto}
.nav::-webkit-scrollbar-thumb{background:#2A4462;border-color:var(--nav)}
.logo{display:flex;align-items:center;gap:10px;padding:15px 17px 13px;border-bottom:1px solid rgba(255,255,255,.09)}
.logo .mark{width:28px;height:28px;border-radius:6px;background:linear-gradient(140deg,#3C6C9E,#1B3A5F);display:grid;place-items:center;font-weight:700;font-size:13px;color:#fff;flex:none}
.logo b{font-size:15px;font-weight:700;letter-spacing:-.02em;display:block;line-height:1.1}
.logo em{font-style:normal;font-size:9.5px;letter-spacing:.13em;color:var(--nav-txt2);text-transform:uppercase}

.tenantbox{padding:11px 13px;border-bottom:1px solid rgba(255,255,255,.09)}
.tenantbox label{display:block;font-size:10px;color:var(--nav-txt2);margin-bottom:5px;letter-spacing:.04em}
.tenantbox select{width:100%;background:var(--nav-hi);color:#fff;border:1px solid rgba(255,255,255,.14);border-radius:6px;padding:6px 8px;font-size:12.5px;font-weight:500}
.tenantbox select option{background:#1B3A5F}

.navgrp{padding:12px 0 2px}
.navgrp h6{margin:0 0 5px;padding:0 17px;font-size:9.5px;font-weight:600;letter-spacing:.11em;color:var(--nav-txt2);text-transform:uppercase}
.navitem{display:flex;align-items:center;gap:9px;width:100%;background:none;border:0;color:var(--nav-txt);padding:7px 17px;text-align:left;font-size:13px;border-left:2.5px solid transparent}
.navitem:hover{background:rgba(255,255,255,.05);color:#E4EDF5}
.navitem.on{background:var(--nav-hi);color:#fff;border-left-color:#5B94CC;font-weight:600}
.navitem .ic{width:15px;flex:none;opacity:.85}
.navitem .bdg{margin-left:auto;font-size:10.5px;font-weight:600;padding:1px 6px;border-radius:9px;background:rgba(255,255,255,.13);color:#D6E4F0}
.navitem .bdg.hot{background:#7E2A24;color:#FFD9D5}
.navitem .bdg.new{background:#1F5B41;color:#B7EBD1}
.navfoot{margin-top:auto;padding:12px 17px;border-top:1px solid rgba(255,255,255,.09);font-size:11px;color:var(--nav-txt2)}
.navfoot b{color:#C6D8E8;font-weight:600;display:block;font-size:12px}

.main{display:flex;flex-direction:column;overflow:hidden}
.hdr{display:flex;align-items:center;gap:14px;padding:0 22px;height:52px;background:var(--card);border-bottom:1px solid var(--line);flex:none}
.hdr h1{margin:0;font-size:15.5px;font-weight:600;letter-spacing:-.01em}
.hdr .sub{font-size:12px;color:var(--ink3)}
.hdr .sp{margin-left:auto;display:flex;align-items:center;gap:9px}
.demoflag{display:inline-flex;align-items:center;gap:5px;font-size:11px;font-weight:600;color:#7A5400;background:var(--amb-soft);border:1px solid var(--amb-line);padding:2px 9px;border-radius:20px;white-space:nowrap}
.search{position:relative}
.search input{width:230px;padding:6px 10px 6px 28px;border:1px solid var(--line);border-radius:7px;background:var(--paper)}
.search span{position:absolute;left:9px;top:6px;color:var(--ink3);font-size:12px}
.body{flex:1;overflow-y:auto;padding:19px 22px 40px}

/* ============ NGUYÊN TỬ ============ */
.btn{border:1px solid var(--line);background:var(--card);border-radius:7px;padding:6px 12px;font-weight:500;color:var(--ink2)}
.btn:hover{background:var(--paper);border-color:#CFCCC4}
.btn.pri{background:var(--steel);border-color:var(--steel);color:#fff}
.btn.pri:hover{background:#16324F}
.btn.dgr{background:var(--red);border-color:var(--red);color:#fff}
.btn.sm{padding:4px 9px;font-size:12px;border-radius:6px}
.btn:disabled{opacity:.45;cursor:not-allowed}

.card{background:var(--card);border:1px solid var(--line);border-radius:10px;box-shadow:var(--sh1)}
.card>h3{margin:0;padding:12px 15px;font-size:13.5px;font-weight:600;border-bottom:1px solid var(--line2);display:flex;align-items:center;gap:9px}
.card>h3 .r{margin-left:auto;font-weight:400;font-size:12px;color:var(--ink3)}
.card .pad{padding:15px}

.grid{display:grid;gap:13px}
.g4{grid-template-columns:repeat(4,1fr)}
.g3{grid-template-columns:repeat(3,1fr)}
.g2{grid-template-columns:repeat(2,1fr)}
@media(max-width:1180px){.g4{grid-template-columns:repeat(2,1fr)}.g3,.g2{grid-template-columns:1fr}}

.kpi{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:13px 15px;box-shadow:var(--sh1)}
.kpi .lb{font-size:11.5px;color:var(--ink3);margin-bottom:5px}
.kpi .vl{font-size:23px;font-weight:600;letter-spacing:-.02em;line-height:1.15}
.kpi .dt{font-size:11.5px;color:var(--ink3);margin-top:4px}
.kpi.al{border-color:var(--red-line);background:var(--red-soft)}
.kpi.al .vl{color:var(--red)}
.kpi.ok .vl{color:var(--grn)}

table{width:100%;border-collapse:collapse}
th{text-align:left;font-size:11.5px;font-weight:600;color:var(--ink3);padding:8px 11px;border-bottom:1px solid var(--line);white-space:nowrap;background:#FAFAF8}
td{padding:9px 11px;border-bottom:1px solid var(--line2);vertical-align:top}
tr:last-child td{border-bottom:0}
.tr-click{cursor:pointer}
.tr-click:hover{background:#FAFAF8}
.num{text-align:right;font-family:"IBM Plex Mono",monospace;font-variant-numeric:tabular-nums;white-space:nowrap}

.chip{display:inline-flex;align-items:center;gap:4px;font-size:11px;font-weight:500;padding:1.5px 7px;border-radius:20px;border:1px solid;white-space:nowrap}
.c-red{background:var(--red-soft);border-color:var(--red-line);color:var(--red)}
.c-grn{background:var(--grn-soft);border-color:var(--grn-line);color:var(--grn)}
.c-amb{background:var(--amb-soft);border-color:var(--amb-line);color:var(--amb)}
.c-stl{background:var(--steel-soft);border-color:#C6D5E4;color:var(--steel)}
.c-gry{background:#F1F0EC;border-color:var(--line);color:var(--ink2)}
.dot{width:6px;height:6px;border-radius:50%;background:currentColor;flex:none}

.tabs{display:flex;gap:3px;border-bottom:1px solid var(--line);margin-bottom:15px}
.tabs button{background:none;border:0;border-bottom:2px solid transparent;padding:7px 13px;color:var(--ink2);font-weight:500;margin-bottom:-1px}
.tabs button.on{color:var(--steel);border-bottom-color:var(--steel);font-weight:600}
.tabs button:hover{color:var(--ink)}

.pills{display:flex;gap:6px;flex-wrap:wrap}
.pills button{border:1px solid var(--line);background:var(--card);border-radius:20px;padding:4px 11px;font-size:12.5px;color:var(--ink2)}
.pills button.on{background:var(--steel);border-color:var(--steel);color:#fff;font-weight:500}

.note{background:var(--amb-soft);border:1px solid var(--amb-line);border-radius:8px;padding:10px 13px;font-size:12.5px;color:#5E4300;display:flex;gap:9px;align-items:flex-start}
.note b{color:#3F2D00}
.note.stl{background:var(--steel-soft);border-color:#C6D5E4;color:#1B3A5F}
.note.stl b{color:#12293F}

.empty{text-align:center;padding:46px 20px;color:var(--ink3)}
.empty b{display:block;color:var(--ink2);font-size:14px;margin-bottom:5px;font-weight:600}

.bar{height:7px;border-radius:4px;background:var(--line2);overflow:hidden}
.bar i{display:block;height:100%;background:var(--steel)}

.modal-bg{position:fixed;inset:0;background:rgba(19,38,57,.42);display:grid;place-items:center;z-index:80;padding:22px}
.modal{background:var(--card);border-radius:12px;box-shadow:var(--sh2);width:100%;max-width:520px;max-height:86vh;overflow:auto}
.modal h3{margin:0;padding:14px 18px;border-bottom:1px solid var(--line2);font-size:15px}
.modal .mp{padding:18px}
.modal .mf{padding:12px 18px;border-top:1px solid var(--line2);display:flex;gap:8px;justify-content:flex-end;background:#FAFAF8;border-radius:0 0 12px 12px}
.fld{margin-bottom:13px}
.fld label{display:block;font-size:12px;font-weight:500;color:var(--ink2);margin-bottom:4px}
.fld input,.fld select,.fld textarea{width:100%;padding:7px 9px;border:1px solid var(--line);border-radius:7px;background:var(--card)}
.toast{position:fixed;bottom:22px;left:50%;transform:translateX(-50%);background:var(--nav);color:#fff;padding:10px 17px;border-radius:9px;box-shadow:var(--sh2);z-index:90;font-size:13px}

/* ============ THANG BIÊN LỢI NHUẬN (module mới) ============ */
.ladder{display:flex;flex-direction:column;gap:0}
.rung{display:grid;grid-template-columns:170px 1fr 132px 74px;gap:13px;align-items:center;padding:9px 0;border-bottom:1px solid var(--line2)}
.rung:last-child{border-bottom:0}
.rung .rl{font-size:13px;font-weight:600}
.rung .rl small{display:block;font-weight:400;font-size:11px;color:var(--ink3);margin-top:1px}
.rung .rbar{position:relative;height:26px;background:#F5F4F0;border-radius:5px;overflow:hidden}
.rung .rbar i{position:absolute;left:0;top:0;bottom:0;background:var(--steel);border-radius:5px}
.rung .rbar i.neg{background:var(--red)}
.rung .rv{text-align:right;font-family:"IBM Plex Mono",monospace;font-variant-numeric:tabular-nums;font-size:14px;font-weight:600}
.rung .rp{text-align:right;font-family:"IBM Plex Mono",monospace;font-size:12px;color:var(--ink3)}
.rung.ded{padding:5px 0}
.rung.ded .rl{font-weight:400;font-size:12.5px;color:var(--ink2);padding-left:15px;position:relative}
.rung.ded .rl:before{content:"";position:absolute;left:4px;top:8px;width:6px;height:1px;background:var(--ink3)}
.rung.ded .rv{font-weight:400;font-size:12.5px;color:var(--ink2)}
.rung.ded .rbar{height:12px;background:transparent}
.rung.ded .rbar i{background:#D8D4CB;border-radius:3px}
.rung.ded .rbar i.plus{background:var(--grn-line)}
.rung.tot{background:#FAFAF8;margin:0 -15px;padding:11px 15px;border-top:1.5px solid var(--line);border-bottom:1.5px solid var(--line)}

.q{display:inline-block;width:7px;height:7px;border-radius:2px;margin-right:5px;vertical-align:middle;flex:none}
.q-r{background:var(--grn)}
.q-e{background:var(--amb)}
.q-n{background:#C9C5BB}
.qlegend{display:flex;gap:15px;font-size:11.5px;color:var(--ink3);align-items:center;flex-wrap:wrap}

/* ============ DỰ BÁO (module mới) ============ */
.cal{display:grid;grid-template-columns:repeat(15,1fr);gap:3px}
.cal .d{display:flex;flex-direction:column;justify-content:flex-end;height:150px;position:relative}
.cal .d .st{width:100%;border-radius:2px 2px 0 0}
.cal .d .s1{background:var(--steel)}
.cal .d .s2{background:#7FA3C4}
.cal .d .s3{background:var(--amb-line)}
.cal .d .lb{font-size:9.5px;color:var(--ink3);text-align:center;margin-top:4px;font-family:"IBM Plex Mono",monospace}
.cal .d:hover .st{filter:brightness(1.12)}
.cal .d .tip{display:none;position:absolute;bottom:100%;left:50%;transform:translateX(-50%);background:var(--nav);color:#fff;padding:7px 10px;border-radius:7px;font-size:11.5px;white-space:nowrap;z-index:9;margin-bottom:5px;box-shadow:var(--sh2)}
.cal .d:hover .tip{display:block}

.sim{display:grid;grid-template-columns:290px 1fr;gap:16px}
@media(max-width:1080px){.sim{grid-template-columns:1fr}}
.simc{background:#FAFAF8;border:1px solid var(--line);border-radius:9px;padding:14px}
.simc h4{margin:0 0 12px;font-size:12.5px;font-weight:600;color:var(--ink2)}
.rng{display:flex;align-items:center;gap:9px;margin-bottom:11px}
.rng label{font-size:12px;flex:none;width:104px;color:var(--ink2)}
.rng input[type=range]{flex:1;accent-color:var(--steel)}
.rng .v{width:46px;text-align:right;font-family:"IBM Plex Mono",monospace;font-size:12.5px;font-weight:600}
.tog{display:flex;align-items:center;justify-content:space-between;padding:7px 0;border-top:1px solid var(--line2)}
.tog span{font-size:12.5px}
.tog small{display:block;color:var(--ink3);font-size:11px}
.sw{width:36px;height:20px;border-radius:12px;background:#D3CFC6;border:0;position:relative;flex:none;transition:background .15s}
.sw:after{content:"";position:absolute;top:2px;left:2px;width:16px;height:16px;border-radius:50%;background:#fff;box-shadow:0 1px 2px rgba(0,0,0,.25);transition:left .15s}
.sw.on{background:var(--steel)}
.sw.on:after{left:18px}

.bt{display:grid;grid-template-columns:repeat(6,1fr);gap:8px}
.bt .c{border:1px solid var(--line);border-radius:8px;padding:9px 10px;background:var(--card)}
.bt .c .p{font-size:11px;color:var(--ink3)}
.bt .c .e{font-size:16px;font-weight:600;font-family:"IBM Plex Mono",monospace;margin-top:3px}
.bt .c.good .e{color:var(--grn)}
.bt .c.bad .e{color:var(--red)}
@media(max-width:1080px){.bt{grid-template-columns:repeat(3,1fr)}}

.spark{display:flex;align-items:flex-end;gap:2px;height:38px}
.spark i{flex:1;background:var(--steel-soft);border-radius:1px 1px 0 0;min-height:2px}
.spark i.hi{background:var(--steel)}
</style>
</head>
<body>
<div id="app"></div>
<script>
/* ==================== DỮ LIỆU MÔ PHỎNG ====================
   Toàn bộ số liệu dưới đây được dựng để minh hoạ sản phẩm.
   Không phải số đo thật trên hệ thống của bất kỳ khách hàng nào. */

const KY = "Tháng 8/2026";

/* --- tiện ích --- */
const T = 1e6; // triệu
function vnd(n,d){ if(n===null||n===undefined) return "—";
  const s = n<0?"-":""; const a=Math.abs(n);
  if(a>=1e9) return s+(a/1e9).toFixed(d===undefined?2:d)+" tỷ";
  if(a>=1e6) return s+Math.round(a/1e6).toLocaleString("vi-VN")+" tr";
  return s+Math.round(a).toLocaleString("vi-VN");
}
function pc(n,t){ if(!t) return "—"; return (n/t*100).toFixed(1)+"%"; }
function kd(s){ return s.normalize("NFD").replace(/[\u0300-\u036f]/g,"").replace(/đ/g,"d").replace(/Đ/g,"D").toLowerCase(); }

/* --- khách hàng --- */

/* --- P&L theo kênh: số gốc, mọi tầng đều tính từ đây --- */
/* q: chất lượng dữ liệu — r = đã đối soát, e = ước tính, n = chưa có */
const PNL = {
 cocoon:{

    q:{cogs:"r", kmSan:"r", ads:"r", aff:"r", dgoi:"e", kho:"e", ns:"e", ht:"e"}},
   {k:"shopee", ten:"Shopee", loai:"Sàn", gmv:8640*T, kmBan:1037*T, kmSan:214*T, hoan:502*T, cogs:2414*T,
    hh:402*T, ttoan:293*T, dvu:88*T, xtra:621*T, ship:186*T, thue:73*T,
    ads:918*T, aff:142*T, dgoi:118*T, kho:196*T, ns:148*T, ht:44*T,
    q:{cogs:"r", kmSan:"r", ads:"r", aff:"r", dgoi:"e", kho:"e", ns:"e", ht:"e"}},
   {k:"tiktok", ten:"TikTok Shop", loai:"Sàn", gmv:5420*T, kmBan:812*T, kmSan:168*T, hoan:758*T, cogs:1366*T,
    hh:172*T, ttoan:201*T, dvu:54*T, xtra:288*T, ship:214*T, thue:40*T,
    ads:806*T, aff:918*T, dgoi:96*T, kho:142*T, ns:186*T, ht:34*T,
    q:{cogs:"r", kmSan:"e", ads:"r", aff:"r", dgoi:"e", kho:"e", ns:"e", ht:"e"}},
   {k:"lazada", ten:"Lazada", loai:"Sàn", gmv:2140*T, kmBan:235*T, kmSan:62*T, hoan:118*T, cogs:610*T,
    hh:96*T, ttoan:74*T, dvu:22*T, xtra:143*T, ship:51*T, thue:18*T,
    ads:218*T, aff:31*T, dgoi:28*T, kho:48*T, ns:42*T, ht:16*T,
    q:{cogs:"r", kmSan:"e", ads:"r", aff:"r", dgoi:"e", kho:"e", ns:"e", ht:"e"}},
   {k:"gtmt", ten:"GT / MT", loai:"Ngoại tuyến", gmv:4260*T, kmBan:383*T, kmSan:0, hoan:64*T, cogs:1373*T,

/* --- tính các tầng biên lợi nhuận từ số gốc --- */
function tinhPNL(c){
  const dtt   = c.gmv - c.kmBan - c.hoan + c.kmSan;
  const lgop  = dtt - c.cogs;
  const phi1  = c.hh + c.ttoan + c.dvu + c.xtra + c.ship + c.thue;
  const cm1   = lgop - phi1;
  const phi2  = c.ads + c.aff + c.dgoi;
  const cm2   = cm1 - phi2;
  const phi3  = c.kho + c.ns + c.ht;
  const cm3   = cm2 - phi3;
  return {...c, dtt, lgop, phi1, cm1, phi2, cm2, phi3, cm3};
}
function pnlKenh(tid){ return PNL[tid].kenh.map(tinhPNL); }
function pnlTong(tid){
  const ks = pnlKenh(tid);
  const s = k => ks.reduce((a,b)=>a+b[k],0);
  return {gmv:s("gmv"), kmBan:s("kmBan"), kmSan:s("kmSan"), hoan:s("hoan"), dtt:s("dtt"),
    cogs:s("cogs"), lgop:s("lgop"), phi1:s("phi1"), cm1:s("cm1"), phi2:s("phi2"), cm2:s("cm2"),
    phi3:s("phi3"), cm3:s("cm3"), hh:s("hh"), ttoan:s("ttoan"), dvu:s("dvu"), xtra:s("xtra"),
    ship:s("ship"), thue:s("thue"), ads:s("ads"), aff:s("aff"), dgoi:s("dgoi"),
    kho:s("kho"), ns:s("ns"), ht:s("ht")};
}

const CHUKY_QT = {shopee:"T+9", tiktok:"T+7", lazada:"T+12", web:"T+2", gtmt:"45 ngày"};
function duBaoDongTien(tid){
  const ks = pnlKenh(tid); const out=[]; let seed=tid.length*7+3;
  const rnd=()=>{ seed=(seed*9301+49297)%233280; return seed/233280; };
  const base = ks.reduce((a,b)=>a+b.dtt-b.phi1,0)/30;
  for(let i=1;i<=30;i++){
    const d=new Date(2026,8,10+i);
    const cuoiTuan = d.getDay()===0||d.getDay()===6;
    const nhip = cuoiTuan?0.72:1.0;
    const doi = (d.getDate()===d.getMonth()+1)?1.9:1.0; /* ngày đôi */
    const v = base*nhip*doi*(0.82+rnd()*0.36);
    const chot = i<=7 ? v*(0.86+rnd()*0.10) : i<=14 ? v*(0.42+rnd()*0.16) : v*0.05;
    const dukien = Math.max(0, v - chot - v*0.06);
    const ruiro = v*(0.045+rnd()*0.035);
    out.push({ngay:d, chot, dukien, ruiro, tong:chot+dukien+ruiro});
  }
  return out;
}

  const rung = (nhan,mo,q,gt,cls)=>`<div class="rung ${cls||""}">
    <div class="rl">${q?qChip(q):""}${nhan}${mo?`<small>${mo}</small>`:""}</div>
    ${bar(gt, cls==="ded"?"":"")}
    <div class="rv" style="${gt<0?"color:var(--red)":""}">${vnd(gt)}</div>
    <div class="rp">${pc(gt,G)}</div></div>`;
  const tru = (nhan,gt,q,plus)=>`<div class="rung ded">
    <div class="rl">${qChip(q)}${nhan}</div>
    <div class="rbar"><i class="${plus?"plus":""}" style="width:${Math.min(Math.abs(gt)/G*100,100)}%"></i></div>
    <div class="rv" style="${plus?"color:var(--grn)":""}">${plus?"+":"−"}${vnd(Math.abs(gt))}</div>
    <div class="rp">${pc(Math.abs(gt),G)}</div></div>`;

  const cogsThieu = cur.q.cogs==="n";
  return `
  <div style="display:flex;gap:9px;align-items:center;margin-bottom:13px;flex-wrap:wrap">
    <div class="pills">${ks.map(k=>`<button class="${cur.k===k.k?"on":""}" data-pkenh="${k.k}">${k.ten}</button>`).join("")}</div>

        <button class="sw ${S.hienCM3?"on":""}" id="swCM3" aria-label="Hiện CM3"></button>Hiện CM3</label>
    </div>
  </div>

  ${cogsThieu?`<div class="note" style="margin-bottom:13px"><span>⚠</span><div><b>Chưa lấy được giá vốn theo SKU cho ${kh().ten}.</b>
    Mọi tầng từ lợi nhuận gộp trở lên chưa dựng được. Bảng dưới dừng ở doanh thu thuần và các khoản phí thu được từ quyết toán.

  <div class="grid g4" style="margin-bottom:14px">

function pnlSKU(){
  const ks = pnlKenh(S.tid), skus = SKU[S.tid]||[];
  const kcol = ks.map(k=>k.k);
  const rows = [];
  skus.forEach(s=>{
    kcol.forEach(kk=>{
      const d = s.kenh[kk]; if(!d||!d.sl) return;
      const f = PHI_KENH[kk];
      const dt = d.sl*d.giaTb*(1-f.hoanTb);
      const cogs = d.sl*s.giaVon*(1-f.hoanTb);
      const phi = dt*(f.hh+f.ttoan+f.xtra) + d.sl*f.shipTb;
      const cm1 = dt - cogs - phi;
      const bienDv = d.giaTb*(1-f.hh-f.ttoan-f.xtra) - s.giaVon - f.shipTb;
      rows.push({sku:s.sku, ten:s.ten, kenh:kk, kten:ks.find(x=>x.k===kk).ten, sl:d.sl, giaTb:d.giaTb, giaVon:s.giaVon, dt, cm1, tl:cm1/dt*100, bienDv});
    });
  });
  const duoiVon = rows.filter(r=>r.bienDv<0);
  let hien = rows.slice();
  if(S.skuLoc==="am") hien = duoiVon;
  if(S.tim) hien = hien.filter(r=>kd(r.sku+r.ten+r.kten).includes(kd(S.tim)));
  hien.sort((a,b)=>a.tl-b.tl);
  return `
  ${duoiVon.length?`<div class="note" style="margin-bottom:13px"><span>⚠</span><div>
    <b>${duoiVon.length} tổ hợp mã hàng và kênh đang bán dưới giá vốn</b> sau khi trừ hoa hồng, phí thanh toán, phí gói Xtra và cước vận chuyển thực trả.
    Tổng doanh thu của nhóm này là ${vnd(duoiVon.reduce((a,b)=>a+b.dt,0))} trong kỳ.
    Đây là lát cắt mà báo cáo theo kênh không nhìn thấy, vì ở tầng kênh các mã lãi bù cho các mã lỗ.</div></div>`:""}
  <div style="display:flex;gap:9px;align-items:center;margin-bottom:13px">
    <div class="pills">
      <button class="${S.skuLoc!=="am"?"on":""}" data-skuloc="all">Tất cả ${rows.length} tổ hợp</button>
      <button class="${S.skuLoc==="am"?"on":""}" data-skuloc="am">Dưới giá vốn ${duoiVon.length}</button></div>
    <div style="margin-left:auto;font-size:12px;color:var(--ink3)">Sắp xếp theo biên CM1 tăng dần</div></div>
  <div class="card"><table>
   <thead><tr><th style="width:118px">Mã hàng</th><th>Tên</th><th style="width:104px">Kênh</th>
     <th class="num">Số lượng</th><th class="num">Giá bán TB</th><th class="num">Giá vốn</th>
     <th class="num">Doanh thu</th><th class="num">CM1</th><th class="num" style="width:74px">Biên</th></tr></thead>
   ${hien.length?hien.map(r=>`<tr style="${r.bienDv<0?"background:var(--red-soft)":""}">
     <td class="mono" style="font-size:12px">${r.sku}</td>
     <td>${r.ten}${r.bienDv<0?` <span class="chip c-red">âm ${vnd(Math.abs(r.bienDv)*r.sl)}</span>`:""}</td>
     <td>${r.kten}</td>
     <td class="num mono">${r.sl.toLocaleString("vi-VN")}</td>
     <td class="num mono">${Math.round(r.giaTb/1000)}k</td>
     <td class="num mono" style="color:var(--ink3)">${Math.round(r.giaVon/1000)}k</td>
     <td class="num mono">${vnd(r.dt)}</td>
     <td class="num mono" style="${r.cm1<0?"color:var(--red);font-weight:600":""}">${vnd(r.cm1)}</td>
     <td class="num mono" style="${r.tl<0?"color:var(--red);font-weight:600":r.tl<10?"color:var(--amb)":""}">${r.tl.toFixed(1)}%</td></tr>`).join("")
    :`<tr><td colspan="9"><div class="empty"><b>Không có tổ hợp nào khớp</b>Xoá từ khoá tìm kiếm hoặc đổi bộ lọc.</div></td></tr>`}
  </table></div>`;
}

        <td class="num mono"><b>${vnd(sum(t30)*ph)}</b></td></tr>`;}).join("")}
    </table></div>
    <div class="card"><h3>Hậu kiểm: dự báo so với thực tế<span class="r">bắt buộc hiện, không được ẩn</span></h3><div class="pad">
      ${hk.length?`<div class="bt">${hk.map(h=>`<div class="c ${Math.abs(h.sl)<2.5?"good":Math.abs(h.sl)>5?"bad":""}">
        <div class="p">${h.ky}</div><div class="e">${h.sl>0?"+":""}${h.sl}%</div></div>`).join("")}</div>
      <div style="font-size:12.5px;color:var(--ink2);margin-top:12px">
        Số dương là dự báo cao hơn thực tế. Sai số thu hẹp dần khi độ phủ ánh xạ tăng: ${kh().ten} hiện ở ${kh().covMap}%.</div>`
      :`<div class="empty"><b>Chưa có kỳ nào để hậu kiểm</b>Cần ít nhất một chu kỳ quyết toán hoàn chỉnh sau khi go-live.</div>`}
    </div></div>
  </div>`;
}

function dbMoPhong(){
  const sim = S.sim, skus = SKU[S.tid]||[], f0 = PHI_KENH[sim.kenh];
  const kten = (pnlKenh(S.tid).find(k=>k.k===sim.kenh)||{ten:sim.kenh}).ten;
  const laSan = sim.kenh!=="web" && sim.kenh!=="gtmt";
  const co = sim.co===undefined ? 1.8 : sim.co;

  function chay(giam, xtra, vou, adsP, affP, nhanSL){
    const xr = (xtra?0.048:0) + (vou?0.031:0);
    let gmv=0, dt=0, cogs=0, phi=0, ads=0, aff=0, am=0, amDt=0; const ct=[];
    skus.forEach(s=>{
      const d = s.kenh[sim.kenh]; if(!d||!d.sl) return;
      const sl = Math.round(d.sl*nhanSL);
      const gia = d.giaTb*(1-giam/100);
      const r = sl*gia*(1-f0.hoanTb);
      const c = sl*s.giaVon*(1-f0.hoanTb);
      const p = r*(f0.hh+f0.ttoan+xr) + sl*f0.shipTb;
      const a = r*(adsP/100), af = r*(affP/100);
      const bienDv = gia*(1-f0.hh-f0.ttoan-xr) - s.giaVon - f0.shipTb;
      gmv+=sl*d.giaTb; dt+=r; cogs+=c; phi+=p; ads+=a; aff+=af;
      if(bienDv<0){ am++; amDt+=r; }
      ct.push({sku:s.sku, ten:s.ten, sl, gia, bienDv, cm1:r-c-p});
    });
    return {gmv, dt, cogs, phi, ads, aff, am, amDt, cm1:dt-cogs-phi, cm2:dt-cogs-phi-ads-aff, ct};
  }

  /* nền: rổ mã hàng này ở mức chiết khấu 0, giữ nguyên mức tham gia gói và chi tiêu như kỳ gốc */
  const nen = chay(0, laSan, laSan, 8, laSan?10:0, 1);
  const nhan = 1 + (sim.giam/100)*co + (sim.xtra?0.22:0) + (sim.voucher?0.14:0) + (sim.ads/100)*1.1;
  const kb  = chay(sim.giam, sim.xtra, sim.voucher, sim.ads, sim.aff, nhan);
  kb.ct.sort((a,b)=>a.bienDv-b.bienDv);

  const dl = (a,b)=>{ const v=a-b; return `<span style="color:${v<0?"var(--red)":"var(--grn)"}">${v>=0?"+":"−"}${vnd(Math.abs(v))}</span>`; };

  return `
  <div class="note stl" style="margin-bottom:14px"><span>ℹ</span><div>
    <b>Chạy ngược thư viện quy tắc phí lên rổ ${skus.length} mã hàng chủ lực của kênh ${kten}.</b>
    Không phải dự báo nhu cầu nên không có sai số kiểu dự báo: chỉ sai nếu biểu phí mã hoá sai, mà biểu phí đã được đối soát với quyết toán thật ở tab dòng tiền.
    Mốc so sánh là chính rổ mã hàng này ở mức chiết khấu 0, không phải số kỳ gốc của cả kênh.
    Hệ số co giãn sản lượng là giả định của người dùng, chỉnh được ở thanh trượt cuối.</div></div>
  <div class="sim">
    <div>
      <div class="simc" style="margin-bottom:12px">
        <h4>Kênh</h4>
        <div class="fld" style="margin-bottom:0"><select id="simKenh">${pnlKenh(S.tid).map(k=>
          `<option value="${k.k}" ${sim.kenh===k.k?"selected":""}>${k.ten}</option>`).join("")}</select></div>
      </div>
      <div class="simc" style="margin-bottom:12px">
        <h4>Mức giảm và chi tiêu</h4>
        <div class="rng"><label>Giảm thêm</label><input type="range" id="rGiam" min="0" max="50" value="${sim.giam}"><span class="v">${sim.giam}%</span></div>
        <div class="rng"><label>Quảng cáo</label><input type="range" id="rAds" min="0" max="30" value="${sim.ads}"><span class="v">${sim.ads}%</span></div>
        <div class="rng"><label>Affiliate, KOC</label><input type="range" id="rAff" min="0" max="35" value="${sim.aff}"><span class="v">${sim.aff}%</span></div>
      </div>
      <div class="simc" style="margin-bottom:12px">
        <h4>Gói tham gia của sàn</h4>
        <div class="tog"><div><span>Freeship Xtra</span><small>phí 4,8% trên doanh thu</small></div>
          <button class="sw ${sim.xtra?"on":""}" id="tXtra" aria-label="Freeship Xtra"></button></div>
        <div class="tog"><div><span>Voucher Xtra</span><small>phí 3,1% trên doanh thu</small></div>
          <button class="sw ${sim.voucher?"on":""}" id="tVou" aria-label="Voucher Xtra"></button></div>
      </div>
      <div class="simc">
        <h4>Giả định của người dùng</h4>
        <div class="rng"><label>Hệ số co giãn</label><input type="range" id="rCo" min="0" max="40" value="${Math.round(co*10)}"><span class="v">${co.toFixed(1)}</span></div>
        <div style="font-size:11.5px;color:var(--ink3);border-top:1px solid var(--line2);padding-top:9px">
          Giảm 1% giá làm sản lượng tăng ${co.toFixed(1)}%. Sản lượng kịch bản bằng <b class="mono">${nhan.toFixed(2)}</b> lần mức nền.
          Đây là con số duy nhất trên màn hình này không lấy từ dữ liệu đối soát.</div>
      </div>
    </div>
    <div>
      <div class="grid g3" style="margin-bottom:13px">
        <div class="kpi"><div class="lb">GMV rổ mã hàng</div><div class="vl mono">${vnd(kb.gmv)}</div>
          <div class="dt">nền ${vnd(nen.gmv)} · ${dl(kb.gmv,nen.gmv)}</div></div>
        <div class="kpi ${kb.cm1<0?"al":""}"><div class="lb">CM1</div><div class="vl mono">${vnd(kb.cm1)}</div>
          <div class="dt">nền ${vnd(nen.cm1)} · ${dl(kb.cm1,nen.cm1)}</div></div>
        <div class="kpi ${kb.cm2<0?"al":"ok"}"><div class="lb">CM2</div><div class="vl mono">${vnd(kb.cm2)}</div>
          <div class="dt">nền ${vnd(nen.cm2)} · ${dl(kb.cm2,nen.cm2)}</div></div>
      </div>
      ${kb.cm2<nen.cm2 && kb.gmv>nen.gmv?`<div class="note" style="margin-bottom:13px"><span>⚠</span><div>
        <b>GMV tăng ${vnd(kb.gmv-nen.gmv)} nhưng CM2 giảm ${vnd(nen.cm2-kb.cm2)}.</b>
        Đây là dạng kịch bản mà báo cáo doanh thu khen còn báo cáo lợi nhuận chê, và thường chỉ lộ ra sau khi sàn quyết toán xong ba tuần sau chiến dịch.</div></div>`:""}
      ${kb.am?`<div class="note" style="margin-bottom:13px"><span>⚠</span><div>
        <b>${kb.am} trong ${skus.length} mã hàng sẽ bán dưới giá vốn ở kịch bản này</b>, chiếm ${vnd(kb.amDt)} doanh thu${nen.am?` (mức nền: ${nen.am} mã)`:""}.
        ${sim.xtra||sim.voucher?"Phí gói Xtra cộng thẳng vào tỷ lệ phí trên từng đơn, không phải chi phí cố định theo tháng, nên nó đẩy các mã giá thấp xuống dưới giá vốn trước tiên.":"Nguyên nhân đến từ mức giảm giá chồng lên hoa hồng sàn và cước vận chuyển thực trả."}</div></div>`:
        `<div class="note stl" style="margin-bottom:13px"><span>✓</span><div>Không mã nào rơi xuống dưới giá vốn ở kịch bản này.</div></div>`}
      <div class="card"><h3>Biên trên từng đơn vị sản phẩm<span class="r">sắp xếp từ thấp lên</span></h3><table>
        <thead><tr><th>Mã hàng</th><th>Tên</th><th class="num">Giá sau giảm</th><th class="num">Sản lượng</th><th class="num">Biên mỗi đơn vị</th><th class="num">CM1</th></tr></thead>
        ${kb.ct.map(r=>`<tr style="${r.bienDv<0?"background:var(--red-soft)":""}">
          <td class="mono" style="font-size:12px">${r.sku}</td><td>${r.ten}</td>
          <td class="num mono">${Math.round(r.gia/1000)}k</td>
          <td class="num mono">${r.sl.toLocaleString("vi-VN")}</td>
          <td class="num mono" style="${r.bienDv<0?"color:var(--red);font-weight:600":""}">${r.bienDv<0?"−":""}${Math.round(Math.abs(r.bienDv)/1000)}k</td>
          <td class="num mono" style="${r.cm1<0?"color:var(--red)":""}">${vnd(r.cm1)}</td></tr>`).join("")}
      </table></div>
    </div>
  </div>`;
}

function dbHoan(){
  const ks = pnlKenh(S.tid);
  return `<div class="note stl" style="margin-bottom:14px"><span>ℹ</span><div>
    <b>Đây là dự báo thống kê thật, phạm vi hẹp.</b> Cần cho hai tab trước chính xác, vì tỷ lệ hoàn là biến ngẫu nhiên duy nhất trong dự báo dòng tiền.
    Mô hình dùng 90 ngày gần nhất theo từng kênh và từng nhóm hàng, kiểm chứng lại sau mỗi kỳ.</div></div>
  <div class="card" style="margin-bottom:14px"><h3>Tỷ lệ hoàn theo kênh<span class="r">thực tế 90 ngày so với dự báo 30 ngày tới</span></h3><table>
    <thead><tr><th>Kênh</th><th class="num">Thực tế 90 ngày</th><th class="num">Dự báo 30 ngày</th><th class="num">Khoảng tin cậy 80%</th><th class="num">Giá trị rủi ro</th></tr></thead>
    ${ks.map(k=>{const tt=k.hoan/(k.gmv-k.kmBan)*100, db=tt*(0.94+(k.k.length%3)*0.05);
      return `<tr><td><b>${k.ten}</b></td><td class="num mono">${tt.toFixed(1)}%</td>
      <td class="num mono"><b>${db.toFixed(1)}%</b></td>
      <td class="num mono" style="color:var(--ink3)">${(db*0.82).toFixed(1)}% – ${(db*1.21).toFixed(1)}%</td>
      <td class="num mono">${vnd(k.dtt*db/100)}</td></tr>`;}).join("")}
  </table></div>
  <div class="note"><span>⚠</span><div>
    <b>TikTok Shop có tỷ lệ hoàn cao gấp nhiều lần các kênh khác</b> do đặc thù đơn phát sinh từ phát trực tiếp.
    Nếu dự báo dòng tiền dùng một tỷ lệ hoàn chung cho mọi kênh thì con số cho TikTok Shop sẽ sai lệch nặng nhất, và đó là kênh có chu kỳ quyết toán ngắn nhất.</div></div>`;
}

function dbDoanhThu(){
  return `<div class="note" style="margin-bottom:14px"><span>⚠</span><div>
    <b>Chức năng này đang tắt theo mặc định, và tôi khuyến nghị để nguyên như vậy.</b>
    Dự báo doanh thu là loại dự báo sai số lớn nhất, cạnh tranh đông nhất và khác biệt ít nhất trong bốn loại ở module này.
    Quan trọng hơn: một con số đối soát sai là lỗi kỹ thuật sửa được, còn một con số dự báo doanh thu sai làm người dùng mất tin vào toàn bộ sản phẩm, kể cả các phần đang đúng.</div></div>
  <div class="card"><div class="empty">
    <b>Chưa bật dự báo doanh thu</b>
    <div style="max-width:520px;margin:0 auto;text-align:left;font-size:13px;color:var(--ink2)">
      <p style="margin:14px 0 8px">Ba điều kiện cần đạt trước khi bật:</p>
      <p style="margin:0 0 7px">Sai số hậu kiểm của dự báo dòng tiền dưới 3% trong sáu kỳ liên tiếp. Nếu phần số học còn sai thì phần thống kê chắc chắn sai hơn.</p>
      <p style="margin:0 0 7px">Ít nhất mười tám tháng dữ liệu liên tục cho mỗi kênh, đủ để tách mùa vụ ngày đôi ra khỏi xu hướng nền.</p>
      <p style="margin:0 0 7px">Khách hàng yêu cầu bằng văn bản và chấp nhận rằng con số này không dùng để lập kế hoạch tài chính.</p>
      <p style="margin:14px 0 0;color:var(--ink3)">Mùa vụ thương mại điện tử Việt Nam với các ngày đôi, phát trực tiếp và thay đổi thuật toán của sàn khiến mô hình chuỗi thời gian thông thường có sai số cao hơn nhiều so với thị trường khác.</p>
    </div>
  </div></div>`;
}
/* ==================== THAO TÁC ==================== */
function gan(){
  const t = $("#selTenant");
  if(t) t.onchange = e => { S.tid=e.target.value; S.caseId=null; S.pnlKenh=null; S.tim=""; ve(); };

  document.querySelectorAll("[data-man]").forEach(b=> b.onclick = ()=>{ S.man=b.dataset.man; S.caseId=null; S.tim=""; ve(); });
  document.querySelectorAll("[data-go]").forEach(a=> a.onclick = e=>{ e.preventDefault(); S.man=a.dataset.go; S.caseId=null; ve(); });
  document.querySelectorAll("[data-case]").forEach(r=> r.onclick = ()=>{ S.man="case"; S.caseId=r.dataset.case; ve(); });
  document.querySelectorAll("[data-back]").forEach(a=> a.onclick = e=>{ e.preventDefault(); S.caseId=null; ve(); });
  document.querySelectorAll("[data-loctt]").forEach(b=> b.onclick = ()=>{ S.locTT=b.dataset.loctt; ve(); });
  document.querySelectorAll("[data-locnhom]").forEach(b=> b.onclick = ()=>{ S.locNhom=b.dataset.locnhom; ve(); });
  document.querySelectorAll("[data-pnltab]").forEach(b=> b.onclick = ()=>{ S.pnlTab=b.dataset.pnltab; S.tim=""; ve(); });
  document.querySelectorAll("[data-dbtab]").forEach(b=> b.onclick = ()=>{ S.dbTab=b.dataset.dbtab; ve(); });
  document.querySelectorAll("[data-pkenh]").forEach(b=> b.onclick = ()=>{ S.pnlKenh=b.dataset.pkenh; ve(); });
  document.querySelectorAll("[data-skuloc]").forEach(b=> b.onclick = ()=>{ S.skuLoc=b.dataset.skuloc; ve(); });

  const sw3 = $("#swCM3"); if(sw3) sw3.onclick = ()=>{ S.hienCM3=!S.hienCM3; ve(); };
  const sel = $("#selSap"); if(sel) sel.onchange = e=>{ S.sapXep=e.target.value; ve(); };

  document.querySelectorAll("[data-qt]").forEach(b=> b.onclick = ()=>{
    const q = S.quyTac.find(x=>x.ma===b.dataset.qt); q.bat=!q.bat;
    ghiNhatKy("Hiệp", (q.bat?"Bật":"Tắt")+" quy tắc "+q.ma, q.ten);
    toast((q.bat?"Đã bật ":"Đã tắt ")+q.ma); ve(); });

  document.querySelectorAll("[data-duyet]").forEach(b=> b.onclick = ()=>{
    const a = S.duyet.find(x=>x.ma===b.dataset.duyet);
    if(!a.quaylui && !confirm(`Yêu cầu ${a.ma} không quay lui được sau khi thực thi.\n\n${a.hq}\n\nXác nhận phê duyệt?`)) return;
    S.duyet = S.duyet.filter(x=>x.ma!==a.ma);
    ghiNhatKy("Hiệp","Phê duyệt "+a.ma, a.lenh+" trên "+a.he);
    toast("Đã thực thi "+a.ma); ve(); });

  document.querySelectorAll("[data-tuchoi]").forEach(b=> b.onclick = ()=>{
    const a = S.duyet.find(x=>x.ma===b.dataset.tuchoi);
    const ly = prompt("Lý do từ chối "+a.ma+":"); if(ly===null) return;
    S.duyet = S.duyet.filter(x=>x.ma!==a.ma);
    ghiNhatKy("Hiệp","Từ chối "+a.ma, ly||"không nêu lý do");
    toast("Đã từ chối "+a.ma); ve(); });

  document.querySelectorAll("[data-dong]").forEach(b=> b.onclick = ()=>{
    const c = S.cases[S.tid].find(x=>x.ma===b.dataset.dong); c.tt="dong";
    ghiNhatKy("Dũng","Đóng trường hợp "+c.ma, c.tien?("Ghi nhận thu hồi "+vnd(c.tien)):"Không phát sinh thu hồi");
    toast("Đã đóng "+c.ma); S.caseId=null; ve(); });
  document.querySelectorAll("[data-mo]").forEach(b=> b.onclick = ()=>{
    const c = S.cases[S.tid].find(x=>x.ma===b.dataset.mo); c.tt="mo";
    ghiNhatKy("Dũng","Mở lại trường hợp "+c.ma,"Chuyển về trạng thái đang mở"); ve(); });
  document.querySelectorAll("[data-giao]").forEach(b=> b.onclick = ()=>{
    const c = S.cases[S.tid].find(x=>x.ma===b.dataset.giao);
    const bp = prompt("Giao "+c.ma+" cho bộ phận nào?", c.pt); if(!bp) return;
    c.pt = bp; ghiNhatKy("Dũng","Giao "+c.ma+" cho "+bp, c.td);
    toast("Đã giao cho "+bp); ve(); });

  /* mô phỏng: cập nhật tại chỗ, không dựng lại cả trang */
  const bind = (id,key,mx)=>{ const el=$(id); if(!el) return;
    el.oninput = e=>{ S.sim[key]=+e.target.value; capNhatSim(); }; };
  bind("#rGiam","giam"); bind("#rAds","ads"); bind("#rAff","aff");
  const rc=$("#rCo"); if(rc) rc.oninput = e=>{ S.sim.co=(+e.target.value)/10; capNhatSim(); };
  const sk = $("#simKenh"); if(sk) sk.onchange = e=>{ S.sim.kenh=e.target.value; ve(); };
  const tx = $("#tXtra"); if(tx) tx.onclick = ()=>{ S.sim.xtra=!S.sim.xtra; ve(); };
  const tv = $("#tVou"); if(tv) tv.onclick = ()=>{ S.sim.voucher=!S.sim.voucher; ve(); };

  const o = $("#oTim");
  if(o){ o.oninput = e=>{ S.tim=e.target.value;
      if(["case","nhatky"].includes(S.man) || (S.man==="pnl"&&S.pnlTab==="sku")){
        $("#body").innerHTML = veMan(); gan();
        const n=$("#oTim"); if(n){} } };
  }
  const x = $("#btnXuat");
  if(x) x.onclick = ()=>{ ghiNhatKy("Dũng","Xuất bảng kê", TIEUDE[S.man][0]+" · "+kh().ten);
    toast("Đã xuất bảng kê "+TIEUDE[S.man][0].toLowerCase()); };
}

/* cập nhật khối kết quả mô phỏng mà không mất tiêu điểm thanh trượt */
function capNhatSim(){
  const wrap = document.querySelector(".sim"); if(!wrap) return;
  const cur = {g:$("#rGiam")&&$("#rGiam").value, a:$("#rAds")&&$("#rAds").value, f:$("#rAff")&&$("#rAff").value, c:$("#rCo")&&$("#rCo").value};
  wrap.outerHTML = dbMoPhong().match(/<div class="sim">[\s\S]*<\/div>\s*$/)[0];
  gan();
  if($("#rGiam")) $("#rGiam").value = cur.g;
  if($("#rAds")) $("#rAds").value = cur.a;
  if($("#rAff")) $("#rAff").value = cur.f;
  if($("#rCo")) $("#rCo").value = cur.c;
}

/* phím tắt */
document.addEventListener("keydown", e=>{
  if(e.key==="/" && document.activeElement.tagName!=="INPUT"){ e.preventDefault(); const o=$("#oTim"); if(o) o.focus(); }
  if(e.key==="Escape"){ const o=$("#oTim");
    if(document.activeElement===o){ o.blur(); }
    else if(S.caseId){ S.caseId=null; ve(); } }
});

ve();

/* để kiểm thử tự động truy cập được trạng thái */
if (typeof window !== "undefined") { window.S = S; window.PNL = PNL; window.SKU = SKU; window.TENANTS = TENANTS; window.NHOM = NHOM; window.PHI_KENH = PHI_KENH; }

</script>
